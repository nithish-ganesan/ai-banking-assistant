services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: change-this-secret-to-a-strong-256-bit-value-for-production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
