services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aibank
      POSTGRES_USER: aibank
      POSTGRES_PASSWORD: aibank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/aibank
      DATABASE_USERNAME: aibank
      DATABASE_PASSWORD: aibank
      DATABASE_DRIVER: org.postgresql.Driver
      JWT_SECRET: change-this-secret-to-a-strong-256-bit-value-for-production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
