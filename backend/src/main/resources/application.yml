spring:
  application:
    name: ai-banking-assistant
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-configured}
            scope:
              - openid
              - profile
              - email
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:aibank;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-strong-256-bit-value-for-production}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    endpoint: https://generativelanguage.googleapis.com/v1beta/models

logging:
  level:
    com.aibank.assistant: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
